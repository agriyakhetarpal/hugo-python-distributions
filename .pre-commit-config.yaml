ci:
  autoupdate_commit_msg: "📈 Update versions for pre-commit hooks"
  autofix_commit_msg: "🪩 Automated fixes from https://pre-commit.ci"
  autoupdate_schedule: "weekly"
  autofix_prs: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "c0f278f1254ccc8fb09676bcdb8d847e7db493e5" # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/asottile/pyupgrade
    rev: "f22ea0651f4355c655cc581f67813c991c74a312" # frozen: v3.22.0
    hooks:
      - id: pyupgrade

  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["--skip=CODE_OF_CONDUCT.md"]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "331f33fa4dfbcbca7c3da3620c137fde0faab273" # frozen: v3.9.10
    hooks:
      - id: prettier
        files: \.(html|md|toml|yml|yaml)
        args: [--prose-wrap=preserve]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: "06a39750ec31860bb44f2acf67182c40016cd1e7" # frozen: v1.32.0
    hooks:
      - id: zizmor
        args: ["--pedantic"]
