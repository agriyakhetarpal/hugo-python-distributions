[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hugo_build_backend"
backend-path = ["scripts"]

[project]
name = "hugo"
authors = [
  { name = "Agriya Khetarpal", email = "agriyakhetarpal@outlook.com" },
]
maintainers = [
  { name = "Agriya Khetarpal", email = "agriyakhetarpal@outlook.com" },
]
description = "Binaries for the deploy edition of the Hugo static site generator, installable with pip"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-hugo.txt"]
requires-python = ">=3.10"
version = "0.169.0"
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: Unix",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Go",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Markup",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Text Processing :: Markup :: reStructuredText",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/agriyakhetarpal/hugo-python-distributions"
Issues = "https://github.com/agriyakhetarpal/hugo-python-distributions/issues"
Changelog = "https://github.com/agriyakhetarpal/hugo-python-distributions/releases"

[project.scripts]
hugo = "hugo.cli:__call"

[tool.hatch.build.targets.wheel]
packages = ["src/hugo"]
# these are generated by the hook and added through force_include only
exclude = [
  "src/hugo/binaries/",
  "src/hugo/_version.py",
]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

# pruning to keep sdist under 10 MiB
[tool.hatch.build.targets.sdist]
exclude = [
  "!hugo-src/**",
  "hugo-src/docs/**",
  "hugo-src/testscripts/**",
  "hugo-src/**/testdata/**",
  "docs/**",
  # build products
  "src/hugo/binaries/**",
  "src/hugo/_version.py",
  "hugo_cache/**",
  "build/**",
  # untracked state hidden only by hugo-src/.gitignore
  "hugo-src/.hugo_commit_date",
  "hugo-src/hugo",
  "hugo-src/hugo.exe",
  "hugo-src/dist/**",
  "hugo-src/public/**",
  "hugo-src/*.test",
  "hugo-src/imports.*",
  "hugo-src/cache/filecache/_gen/**",
  # this is only meaningful inside `git archive`
  ".git_archival.txt",
]

[tool.cibuildwheel]
# CI overrides CIBW_BUILD to also exercise the build on other interpreters
# but since we are shipping a none-any wheel this doesn't matter for local
# builds as we don't want to build multiple wheels
build = "cp314-*"
skip = "*musllinux*"
test-command = """
hugo version
hugo env --logLevel debug
"""

[tool.cibuildwheel.windows]
# auto would also build 32-bit x86 on a 64-bit runner. That target is
# cross-compiled in its own job, so build only the runner's native 64-bit
# arch (AMD64 on windows-latest, ARM64 on windows-11-arm).
archs = ["auto64"]

[tool.ruff]
src = ["src"]
lint.extend-select = [
  "B",        # flake8-bugbear
  "I",        # isort
  "ARG",      # flake8-unused-arguments
  "C4",       # flake8-comprehensions
  "EM",       # flake8-errmsg
  "ICN",      # flake8-import-conventions
  "G",        # flake8-logging-format
  "PGH",      # pygrep-hooks
  "PIE",      # flake8-pie
  "PL",       # pylint
  "PT",       # flake8-pytest-style
  "PTH",      # flake8-use-pathlib
  "RET",      # flake8-return
  "RUF",      # Ruff-specific
  "SIM",      # flake8-simplify
  "UP",       # pyupgrade
  "YTT",      # flake8-2020
  "NPY",      # NumPy specific rules
  "PD",       # pandas-vet
]
lint.ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "ISC001",   # Conflicts with formatter
  "PLC0415",  # Import should be at the top-level of a file
]

[tool.ruff.lint.per-file-ignores]
"noxfile.py" = ["T20"]
