name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * sun"
    - cron: "0 12 * * wed"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

permissions: {}

jobs:
  style:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run style checks
        uses: j178/prek-action@v3.1.0

  lockfile:
    name: actions-lockfile
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify the GitHub Actions lockfile
        run: gh actions-lock --verify

  editable_install:
    needs: [style]
    name: editable-install-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          activate-environment: true

      - name: Install Python dependencies
        run: uv pip install nox[uv]

      - name: Smoke test editable install entry points
        run: nox -s editable

  build_wheels:
    needs: [style]
    name: ${{ matrix.runs-on }}-python-${{ matrix.python-version }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
        runs-on:
          [
            ubuntu-latest,
            ubuntu-22.04-arm,
            macos-15-intel,
            macos-latest,
            windows-latest,
            windows-11-arm,
          ]
        # CPython ships native Windows arm64 builds for 3.11 and later only
        exclude:
          - runs-on: windows-11-arm
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: .
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp${{ matrix.python-version == '3.10' && '310' || matrix.python-version == '3.13' && '313' || '314' }}-*"

  cross_compile:
    needs: [style]
    name: cross-${{ matrix.runs-on }}-${{ matrix.architecture }}-python-${{ matrix.python-version }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, windows-latest]
        architecture: [arm64, i686]
        python-version: ["3.10", "3.13", "3.14"]
        # Cross-compile arm64 on Linux and i686 on Windows only.
        # Test just one Python version on Windows for now.
        exclude:
          - runs-on: ubuntu-latest
            architecture: i686
          - runs-on: windows-latest
            architecture: arm64
          - python-version: "3.10"
            runs-on: windows-latest
          - python-version: "3.14"
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build binary distribution (wheel) on Linux
        if: matrix.runs-on == 'ubuntu-latest'
        # can't repair arm64 wheels on Linux x86_64 right now
        # auditwheel repair --plat manylinux_2_28_aarch64 -w wheelhouse/ dist/*.whl
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: .
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp${{ matrix.python-version == '3.10' && '310' || matrix.python-version == '3.13' && '313' || '314' }}-*"
          CIBW_ARCHS_LINUX: x86_64
          # This job lies about the arch (x86_64 container, aarch64 wheel via the
          # goos/goarch config settings), so its build identifier collides with
          # the native x86_64 build and can't be selected in a pyproject override
          #
          # Keep the cross settings here, and disable the global test-command and
          # repair, as the aarch64 wheel can neither run nor be repaired on x86_64
          CIBW_CONFIG_SETTINGS_LINUX: "goos=linux goarch=arm64"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: ""
          CIBW_TEST_COMMAND: ""

        # Note: cibuildwheel will manage installing 32-bit Python on Windows. We
        # do not need to do that manually unless we use setup-python instead.
      - name: Build binary distribution (wheel) on Windows (i686)
        if: matrix.runs-on == 'windows-latest' && matrix.architecture == 'i686'
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: .
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_WINDOWS: x86

      - name: Upload artifacts for debugging
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels_${{ matrix.runs-on }}_${{ matrix.architecture }}_py${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

  inspect_distributions:
    needs: [style]
    name: inspect-sdist-wheel-contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      # so that we don't pick up Go on a runner in case it's there
      - name: Check that go-bin is a dynamic build requirement
        run: |
          uv run --no-project --with hatchling python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          import hugo_build_backend
          requires = hugo_build_backend.get_requires_for_build_wheel()
          print(requires)
          assert any(r.startswith("go-bin==") for r in requires), requires
          EOF

      - name: Build source distribution (SDist) and binary distribution (wheel)
        run: |
          uvx --from build pyproject-build --sdist --wheel . --outdir dist/
          uvx twine check dist/* --strict

        # The root .gitignore applies inside hugo-src, so a new Hugo release
        # could lose files silently. Just a smoke check like this is fine
      - name: Check that the sdist contains every tracked Hugo source file
        run: |
          SDIST=$(ls dist/*.tar.gz)
          PREFIX=$(tar -tzf "$SDIST" | head -1 | cut -d/ -f1)
          git -C hugo-src -c core.quotePath=false ls-files | grep -vE '^(docs|testscripts)/|(^|/)testdata/' | sort > expected.txt
          tar -tzf "$SDIST" | sed -n "s#^$PREFIX/hugo-src/##p" | grep -v '^$' | sort > actual.txt
          comm -23 expected.txt actual.txt > missing.txt
          if [ -s missing.txt ]; then
            echo "::error::tracked hugo-src files missing from the sdist:"
            cat missing.txt
            exit 1
          fi
          echo "All $(wc -l < expected.txt) tracked hugo-src files are in the sdist"

      - name: Check sdist size, fail if it exceeds 10 MiB
        run: |
          MAX_SIZE_MB=10
          SDIST=$(ls dist/*.tar.gz)
          SIZE=$(stat --format=%s "$SDIST")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE / 1048576}")
          echo "sdist size: ${SIZE_MB} MB"
          if [ "$SIZE" -gt $((MAX_SIZE_MB * 1048576)) ]; then
            echo "::error::sdist is ${SIZE_MB} MB, exceeding the ${MAX_SIZE_MB} MB limit"
            exit 1
          fi

      - name: Build, inspect, and display contents of distributions
        shell: bash
        run: |
          mkdir -p output/sdist
          tar -xf dist/*.tar.gz -C output/sdist

          echo -e '## View source distribution (SDist) contents\n' >> $GITHUB_STEP_SUMMARY
          echo -e '```\n' >> $GITHUB_STEP_SUMMARY
          (cd output/sdist && tree -a * | sed 's/^/    /' | tee -a $GITHUB_STEP_SUMMARY)
          echo -e '\n```\n' >> $GITHUB_STEP_SUMMARY

          mkdir -p output/wheel
          uvx --from wheel wheel unpack dist/*.whl -d output/wheel

          echo -e '## View binary distribution (wheel) contents\n' >> $GITHUB_STEP_SUMMARY
          echo -e '```\n' >> $GITHUB_STEP_SUMMARY
          (cd output/wheel && tree -a * | sed 's/^/    /' | tee -a $GITHUB_STEP_SUMMARY)
          echo -e '\n```\n' >> $GITHUB_STEP_SUMMARY
